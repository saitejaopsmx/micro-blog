spring.application.name=micro-blog
aws.region=us-west-2
aws.s3.bucket-name=micro-blogging

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.version=OPENAPI_3_0
springdoc.info.title=Micro-Blogging API
springdoc.info.description=A simple micro-blogging application that uses AWS S3 for data storage.
springdoc.info.version=1.0.0
